<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - Smart Attendance AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .box { text-align: center; background: white; padding: 50px 40px; border-radius: 18px; box-shadow: 0 8px 25px rgba(15,23,42,0.07); }
        .code { font-size: 60px; font-weight: bold; color: #2563eb; margin-bottom: 10px; }
        .message { color: #64748b; margin-bottom: 25px; }
        a { text-decoration: none; background: #2563eb; color: white; padding: 12px 26px; border-radius: 10px; font-weight: bold; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">{{ code }}</div>
        <p class="message">{{ message }}</p>
        <a href="/">Back to Dashboard</a>
    </div>
</body>
</html>
